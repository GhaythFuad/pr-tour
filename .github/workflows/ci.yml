name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm package
      - name: Check the portable checker is current
        run: git diff --exit-code -- skills/prepare-pr-for-review/scripts/check-tour.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pr-tour-packages
          path: release/*.zip
